name: Update KeyCRM XML feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scripts/config/requirements.txt
      - name: Run offline validation tests
        run: |
          python -m unittest discover -s scripts/tests -v
      - name: Generate EVA XML
        env:
          KEYCRM_API_KEY: ${{ secrets.KEYCRM_API_KEY }}
        run: python scripts/generation/generate_feed.py
      - name: Generate Rozetka XML
        run: python scripts/generation/generate_rozetka.py
      - name: Commit updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pricelists/eva.xml pricelists/rozetka.xml
          git diff --cached --quiet || (
            git commit -m "Update EVA and Rozetka XML feeds" &&
            git push
          )
